name: Lean degenerate-witness audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install patched Lean 4.35.0 and generate lake manifest
        run: |
          curl --fail --location --retry 3 --max-time 60 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Fetch the audited upstream source
        run: |
          curl --fail --location --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/axxen95/Lean-4-formalization-of-the-Erd-s-Selfridge-odd-covering-system-conjecture/fe530b2cedd3a71c2cdb47cc36ed0c3cb047b086/ErdosSelfridge_v17_fixed.lean \
            --output ErdosSelfridge_v17_fixed.lean
      - name: Install dependencies and restore Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
      - name: Compile audited upstream source
        run: |
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/ErdosSelfridge_v17_fixed.olean ErdosSelfridge_v17_fixed.lean
      - name: Run focused degenerate-witness tests
        run: lake env lean AuditCheck.lean
      - name: Compile disjoint-block factorization lemma
        run: lake env lean BBMSTDisjointFactorization.lean
      - name: Compile finite weighted overlap-conditioning identity
        run: lake env lean BBMSTOverlapConditioning.lean
      - name: Compile effective block-size monotonicity
        run: lake env lean BBMSTBlockSize.lean
      - name: Compile scalar BBMST fiber-mass normalization
        run: lake env lean BBMSTFiberSieve.lean
      - name: Compile source-faithful product-box hyperplane geometry
        run: lake env lean BBMSTProductBox.lean
      - name: Compile exact product-box cardinality and compatible intersections
        run: lake env lean BBMSTProductBoxCardinality.lean
      - name: Install sandbox dependency for independent recheck
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Export and independently recheck project declarations
        run: lake check
