name: Lean degenerate-witness audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and generate lake manifest
        run: |
          curl --fail --location --retry 3 --max-time 60 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.28.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Fetch the audited upstream source
        run: |
          curl --fail --location --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/axxen95/Lean-4-formalization-of-the-Erd-s-Selfridge-odd-covering-system-conjecture/fe530b2cedd3a71c2cdb47cc36ed0c3cb047b086/ErdosSelfridge_v17_fixed.lean \
            --output ErdosSelfridge_v17_fixed.lean
      - name: Install dependencies and restore Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
      - name: Compile audited upstream source
        run: |
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/ErdosSelfridge_v17_fixed.olean ErdosSelfridge_v17_fixed.lean
      - name: Compile MeasureTransition module
        run: lake env lean -o .lake/build/lib/lean/MeasureTransition.olean MeasureTransition.lean
      - name: Run focused degenerate-witness tests
        run: lake env lean AuditCheck.lean

      - name: Compile validated finite parameter interface
        run: lake env lean -o .lake/build/lib/lean/ValidatedParameters.olean ValidatedParameters.lean

      - name: Compile parameter integrity regression tests
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/ParameterIntegrityTests.olean ParameterIntegrityTests.lean 2>&1 | tee /tmp/parameter-integrity-tests.log
          ! grep -q 'sorryAx' /tmp/parameter-integrity-tests.log

      - name: Compile finite coordinate geometry incidence tests
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/BBMSTGeometryTest.olean BBMSTGeometryTest.lean 2>&1 | tee /tmp/bbmst-geometry-tests.log
          ! grep -q 'sorryAx' /tmp/bbmst-geometry-tests.log

      - name: Compile generic finite product-sum identity
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/FiniteProductSumAudit.olean FiniteProductSumAudit.lean 2>&1 | tee /tmp/finite-product-sum.log
          ! grep -q 'sorryAx' /tmp/finite-product-sum.log

      - name: Compile normalized finite product mass audit
        run: |
          set -o pipefail
          lake env lean FiniteProductNormalizationAudit.lean 2>&1 | tee /tmp/finite-product-normalization.log
          ! grep -q 'sorryAx' /tmp/finite-product-normalization.log

      - name: Compile exact intersection-mass transfer
        run: |
          set -o pipefail
          lake env lean BBMSTIntersectionMass.lean 2>&1 | tee /tmp/bbmst-intersection-mass.log
          ! grep -q 'sorryAx' /tmp/bbmst-intersection-mass.log

      - name: Compile weighted additive-error composition
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/GoodBadComposition.olean GoodBadComposition.lean 2>&1 | tee /tmp/good-bad-composition.log
          ! grep -q 'sorryAx' /tmp/good-bad-composition.log

      - name: Compile BBMST finite dependency interface
        run: |
          set -o pipefail
          lake env lean BBMSTDependencyInterface.lean 2>&1 | tee /tmp/bbmst-dependency-interface.log
          ! grep -q 'sorryAx' /tmp/bbmst-dependency-interface.log

      - name: Compile source-faithful BBMST local-lemma budget
        run: |
          set -o pipefail
          lake env lean BBMSTSourceLocalLemma.lean 2>&1 | tee /tmp/bbmst-source-local-lemma.log
          ! grep -q 'sorryAx' /tmp/bbmst-source-local-lemma.log
