name: DJO2 CAOS PostgreSQL integration
on:
  pull_request:
    paths:
      - 'JARVIS-Core/railway/Worker/**'
      - '.github/workflows/djo2-caos-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: caos_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: caos_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: JARVIS-Core/railway/Worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test test/caos-postgres.integration.mjs
        env:
          CAOS_TEST_DATABASE_URL: postgres://caos_test:local-ci-only@127.0.0.1:5432/caos_test
