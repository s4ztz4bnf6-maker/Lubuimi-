name: Stage fibre Lean 4.28.0 test

on:
  pull_request:
    branches: [audit/diagnostic-sandbox]
  push:
    branches: [audit/stage-fiber-lean428-test-2026-10-20]

jobs:
  compile-stage-fiber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and resolve Lake manifest
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" update
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Compile dependent stage fibre equivalence
        run: lake env lean StageFiberEquivTest.lean
