name: DJO2 maintenance PostgreSQL
on:
  pull_request:
    branches: [jarvis-core]
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: diagnosis
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - working-directory: JARVIS-Core/railway/Worker
        run: bun install
      - working-directory: JARVIS-Core/railway/Worker
        env:
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/diagnosis
        run: |
          bun -e '
          import postgres from "postgres";
          import assert from "node:assert/strict";
          import { diagnoseDatabase } from "./maintenance-readonly.mjs";
          const sql=postgres(process.env.DATABASE_URL);
          try {
            await sql.unsafe("CREATE TABLE agent_tasks(id bigserial primary key,status text,attempt_count int,max_attempts int,next_retry_at timestamptz,started_at timestamptz,completed_at timestamptz,created_at timestamptz default now())");
            await sql.unsafe("INSERT INTO agent_tasks(id,status,attempt_count,max_attempts,next_retry_at) VALUES (2115,\x27queued\x27,0,3,NULL),(2116,\x27retry_wait\x27,1,3,now()-interval \x271 minute\x27),(2117,\x27retry_wait\x27,1,3,now()+interval \x271 hour\x27),(2118,\x27queued\x27,3,3,NULL)");
            const d=await diagnoseDatabase(sql,"diagnose");
            assert.equal(d.total,4); assert.equal(d.claimable_now,2); assert.equal(d.waiting,1); assert.equal(d.attempts_exhausted,1);
            assert.equal((await diagnoseDatabase(sql,"task:2115")).task.id,"2115");
            await assert.rejects(diagnoseDatabase(sql,"triage-apply"));
            assert.equal((await diagnoseDatabase(sql,"diagnose")).total,4);
            console.log("PASS real PostgreSQL maintenance diagnosis");
          } finally { await sql.end(); }'
