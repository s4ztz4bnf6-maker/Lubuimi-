name: BBMST geometry core kernel check

on:
  push:
    branches:
      - "audit/bbmst-geometry-core-2026-11-05"
    paths:
      - "BBMSTGeometryStageCore.lean"
      - "BBMSTCodimOneReduction.lean"
      - "BBMSTCodimOneFamily.lean"
      - "lakefile.lean"
      - "lean-toolchain"
      - ".github/workflows/bbmst-geometry.yml"
  pull_request:
    paths:
      - "BBMSTGeometryStageCore.lean"
      - "lakefile.lean"
      - "lean-toolchain"
      - ".github/workflows/bbmst-geometry.yml"
  workflow_dispatch:

concurrency:
  group: bbmst-geometry-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.28.0
        run: |
          curl --fail --location --retry 3 --max-time 60 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.28.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Restore Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
      - name: Compile BBMST geometric stage core
        run: |
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/BBMSTGeometryStageCore.olean BBMSTGeometryStageCore.lean
      - name: Compile codimension-one restriction core
        run: lake env lean BBMSTCodimOneReduction.lean
      - name: Compile codimension-one family consequences
        run: lake env lean BBMSTCodimOneFamily.lean
