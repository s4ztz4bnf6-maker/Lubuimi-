name: JARVIS discovery validation
on:
  pull_request:
    branches: [jarvis-core]
    paths:
      - 'JARVIS-Core/railway/Worker/**'
      - '.github/workflows/jarvis-discovery.yml'
  workflow_dispatch:
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check JARVIS-Core/railway/Worker/discovery.mjs
      - run: node --test JARVIS-Core/railway/Worker/test/discovery.test.mjs
