name: Lean 4.28 BBMST sandbox

on:
  push:
    branches: [bbmst-geometry-sandbox]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.28.0
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.28.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Lake dependencies
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Compile finite example
        run: lake env lean BBMSTFiniteExample.lean
      - name: Compile coordinate geometry model
        run: lake env lean BBMSTGeometryTest.lean
