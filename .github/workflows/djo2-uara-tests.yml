name: DJO2 UARA tests
on:
  pull_request:
    branches: [jarvis-core]
permissions:
  contents: read
jobs:
  uara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test JARVIS-Core/railway/Worker/tools/uara-policy.test.mjs
