name: JARVIS self-development guardrails

on:
  pull_request:
    paths:
      - "JARVIS-Core/tools/self-development-controller.mjs"
      - "JARVIS-Core/tests/self-development-controller.test.mjs"
      - ".github/workflows/jarvis-selfdev-guardrails.yml"
  push:
    branches:
      - "jarvis-selfdev-loop-2026-11-20"
    paths:
      - "JARVIS-Core/tools/self-development-controller.mjs"
      - "JARVIS-Core/tests/self-development-controller.test.mjs"
      - ".github/workflows/jarvis-selfdev-guardrails.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run JARVIS self-development policy tests
        run: node --test JARVIS-Core/tests/self-development-controller.test.mjs
