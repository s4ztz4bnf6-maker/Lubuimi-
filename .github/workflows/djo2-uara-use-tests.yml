name: DJO2 UARA and USE tests
on:
  pull_request:
    branches: [jarvis-core]
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
        working-directory: JARVIS-Core/UARA
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 trafilatura
      - run: python -m unittest test_adapters
        working-directory: JARVIS-Core/USE
