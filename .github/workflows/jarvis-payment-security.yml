name: JARVIS payment and agent security checks
on:
  pull_request:
    paths:
      - 'JARVIS-Core/railway/Gateway/**'
      - '.github/workflows/jarvis-payment-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: JARVIS-Core/railway/Gateway
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'
      - run: bun install --no-save
      - run: bun test src/payment-router.test.ts src/bank-receive-only.test.ts src/opportunity-intake.test.ts src/agent-payment-boundary.test.ts src/approved-http-client.test.ts services/btc-monitor/monitor.test.ts src/invoice-payment-details.test.ts src/payment-followups.test.ts
