name: DJO2 worker checkpoint tests
on:
  push:
    branches: [djo2/worker-context-budget-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: JARVIS-Core/railway/Worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/checkpoint-boundaries.test.mjs
