name: BBMST geometry focused compile

on:
  push:
    paths:
      - 'BBMSTGeometryTest.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/bbmst-geometry-check.yml'
  pull_request:
    paths:
      - 'BBMSTGeometryTest.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/bbmst-geometry-check.yml'
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and generate lake manifest
        run: |
          curl --fail --location --retry 3 --max-time 60 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.28.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Install dependencies and restore Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
      - name: Compile BBMST coordinate geometry sandbox
        run: lake env lean BBMSTGeometryTest.lean
