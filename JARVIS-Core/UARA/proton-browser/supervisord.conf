[supervisord]
nodaemon=true
[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
priority=1
autorestart=true
[program:vnc]
command=x11vnc -display :99 -rfbauth /tmp/vncpass -forever -localhost
priority=2
autorestart=true
[program:novnc]
command=websockify --web /usr/share/novnc 127.0.0.1:6080 localhost:5900
priority=3
autorestart=true
[program:browser]
command=python /app/browser.py
environment=DISPLAY=":99"
priority=4
autorestart=true

[program:caddy]
command=caddy run --config /app/Caddyfile --adapter caddyfile
priority=5
autorestart=true
